      - name: "Sol-Ark Test Total Grid Export"
        unique_id: solark_test_total_grid_export
        slave: 1
        address: 81
        input_type: holding
        data_type: uint32
        swap: word
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        scan_interval: 60

      # ---- Battery energy ----
      - name: "Sol-Ark Test Day Battery Charge"
