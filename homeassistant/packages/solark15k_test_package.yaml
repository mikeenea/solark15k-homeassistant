# Sol-Ark 15K - native Home Assistant Modbus first-test package
#
# READ ONLY. No write entities are defined.
#
# Before use:
#   1. Configure Waveshare CH1 for Modbus TCP <-> RTU on TCP 502.
#   2. Configure serial as 9600/8/N/1.
#   3. Use non-storage gateway mode.
#   4. Edit the host IP below.
#
# Protocol basis: public Sol-Ark Modbus RTU Protocol V1.4.
# Slave ID for this map is fixed at 1.

modbus:
  - name: solark_test
    type: tcp
    host: 192.168.1.241
    port: 502
    timeout: 5
    delay: 1
    message_wait_milliseconds: 100

    sensors:
      # ---- Grid / energy ----
      - name: "Sol-Ark Test Grid Frequency"
        unique_id: solark_test_grid_frequency
        slave: 1
        address: 79
        input_type: holding
        data_type: uint16
        scale: 0.01
        precision: 2
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
        scan_interval: 10

      - name: "Sol-Ark Test Day Grid Import"
        unique_id: solark_test_day_grid_import
        slave: 1
        address: 76
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        scan_interval: 60

      - name: "Sol-Ark Test Day Grid Export"
        unique_id: solark_test_day_grid_export
        slave: 1
        address: 77
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        scan_interval: 60

      # Total grid import is non-contiguous: low=78, high=80.
      - name: "Sol-Ark Test Total Grid Import Low Raw"
        unique_id: solark_test_total_grid_import_low_raw
        slave: 1
        address: 78
        input_type: holding
        data_type: uint16
        scan_interval: 60

      - name: "Sol-Ark Test Total Grid Import High Raw"
