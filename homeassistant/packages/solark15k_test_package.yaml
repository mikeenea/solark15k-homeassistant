template:
  - sensor:
      - name: "Sol-Ark Test Total PV Power"
        unique_id: solark_test_total_pv_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ has_value('sensor.sol_ark_test_pv1_power')
             and has_value('sensor.sol_ark_test_pv2_power')
             and has_value('sensor.sol_ark_test_pv3_power') }}
        state: >
          {{ (states('sensor.sol_ark_test_pv1_power') | float(0)
            + states('sensor.sol_ark_test_pv2_power') | float(0)
            + states('sensor.sol_ark_test_pv3_power') | float(0)) | round(0) }}

      - name: "Sol-Ark Test Grid Import Power"
        unique_id: solark_test_grid_import_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.sol_ark_test_grid_total_power') }}"
        state: >
          {% set p = states('sensor.sol_ark_test_grid_total_power') | float(0) %}
          {{ [p, 0] | max | round(0) }}

      - name: "Sol-Ark Test Grid Export Power"
        unique_id: solark_test_grid_export_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.sol_ark_test_grid_total_power') }}"
        state: >
          {% set p = states('sensor.sol_ark_test_grid_total_power') | float(0) %}
          {{ [-p, 0] | max | round(0) }}

      - name: "Sol-Ark Test Total Grid Import Energy"
        unique_id: solark_test_total_grid_import_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >
          {{ has_value('sensor.sol_ark_test_total_grid_import_low_raw')
             and has_value('sensor.sol_ark_test_total_grid_import_high_raw') }}
        state: >
          {% set lo = states('sensor.sol_ark_test_total_grid_import_low_raw') | int(0) %}
          {% set hi = states('sensor.sol_ark_test_total_grid_import_high_raw') | int(0) %}
          {{ ((hi * 65536 + lo) * 0.1) | round(1) }}

      - name: "Sol-Ark Test Grid Relay State"
        unique_id: solark_test_grid_relay_state
        availability: "{{ has_value('sensor.sol_ark_test_grid_relay_raw') }}"
        state: >
          {% set x = states('sensor.sol_ark_test_grid_relay_raw') | int(-1) %}
          {% if x == 1 %}Open
          {% elif x == 2 %}Closed
          {% else %}Unknown ({{ x }})
          {% endif %}

      - name: "Sol-Ark Test Generator Relay State"
        unique_id: solark_test_generator_relay_state
        availability: "{{ has_value('sensor.sol_ark_test_generator_relay_raw') }}"
        state: >
          {% set x = (states('sensor.sol_ark_test_generator_relay_raw') | int(0)) % 16 %}
          {% if x == 0 %}Open
          {% elif x == 1 %}Closed
          {% elif x == 2 %}No Connection
          {% elif x == 3 %}Closed when Generator is on
          {% else %}Unknown ({{ x }})
          {% endif %}

  - binary_sensor:
      - name: "Sol-Ark Test Any Fault"
        unique_id: solark_test_any_fault
        availability: >
          {{ has_value('sensor.sol_ark_test_fault_word_1')
             and has_value('sensor.sol_ark_test_fault_word_2')
             and has_value('sensor.sol_ark_test_fault_word_3')
             and has_value('sensor.sol_ark_test_fault_word_4') }}
        state: >
          {{ (states('sensor.sol_ark_test_fault_word_1') | int(0)) != 0
             or (states('sensor.sol_ark_test_fault_word_2') | int(0)) != 0
             or (states('sensor.sol_ark_test_fault_word_3') | int(0)) != 0
             or (states('sensor.sol_ark_test_fault_word_4') | int(0)) != 0 }}
        device_class: problem
